name: Update README

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master

      - uses: 'actions-go/go-install@main'
        id: install
        with:
          module: "github.com/taciturnaxolotl/markscribe@HEAD"

      - name: debug secrets
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          echo "WAKATIME_API_KEY length: ${#WAKATIME_API_KEY}"
          echo "WAKATIME_URL value: $WAKATIME_URL"

      - name: test wakatime api
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          echo "--- With curl default User-Agent ---"
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic $(echo -n $WAKATIME_API_KEY | base64)" \
            -H "Accept: application/json" \
            "${WAKATIME_URL}/users/current/stats/last_7_days"
          echo ""
          echo "--- With Go User-Agent ---"
          curl -s -o /tmp/go-ua.txt -w "%{http_code}" \
            -H "Authorization: Basic $(echo -n $WAKATIME_API_KEY | base64)" \
            -H "Accept: application/json" \
            -H "User-Agent: Go-http-client/2.0" \
            "${WAKATIME_URL}/users/current/stats/last_7_days"
          echo ""
          echo "Go UA response:"
          cat /tmp/go-ua.txt | head -c 300

      - name: generate readme
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: ${{ steps.install.outputs.install-path }} -write README.md templates/README.md.tpl

      - uses: stefanzweifel/git-auto-commit-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: update README"
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
