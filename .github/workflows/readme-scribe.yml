name: Update README

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master

      - uses: 'actions-go/go-install@main'
        id: install
        with:
          module: "github.com/taciturnaxolotl/markscribe@HEAD"

      - name: debug secrets
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          echo "WAKATIME_API_KEY length: ${#WAKATIME_API_KEY}"
          echo "WAKATIME_URL value: $WAKATIME_URL"

      - name: test wakatime api
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: |
          echo "URL length: ${#WAKATIME_URL}"
          echo "URL last 20 chars: ${WAKATIME_URL: -20}"
          echo "--- Checking for redirects ---"
          curl -s -D - -o /dev/null \
            -H "Authorization: Basic $(echo -n $WAKATIME_API_KEY | base64)" \
            -H "Accept: application/json" \
            "${WAKATIME_URL}/users/current/stats/last_7_days" 2>&1 | grep -iE "HTTP/|location"
          echo "--- Go base64 vs shell base64 ---"
          echo "Shell base64: $(echo -n $WAKATIME_API_KEY | base64)"
          echo "Key first 8 chars: ${WAKATIME_API_KEY:0:8}"

      - name: generate readme
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: ${{ steps.install.outputs.install-path }} -write README.md templates/README.md.tpl

      - uses: stefanzweifel/git-auto-commit-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: update README"
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
