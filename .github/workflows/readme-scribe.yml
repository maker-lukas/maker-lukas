name: Update README

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker://ghcr.io/taciturnaxolotl/markscribe:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: https://hackatime.hackclub.com/api/v1/
        with:
          args: -write README.md templates/README.md.tpl

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update README"
          branch: main
